name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy" && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic -v 2>&1 | tee test-output.log
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-output
          path: test-output.log

  fe-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FE
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './FE/pnpm-lock.yaml'
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
        continue-on-error: true

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Run login-service migrations
        run: migrate -database "postgres://wms:wms@localhost:5432/wms_test?sslmode=disable" -path login-service/migrations up
      - name: Run customer-service migrations
        run: migrate -database "postgres://wms:wms@localhost:5432/wms_test?sslmode=disable" -path customer-service/migrations up
      - name: Run inbound-service migrations
        run: migrate -database "postgres://wms:wms@localhost:5432/wms_test?sslmode=disable" -path inbound-service/migrations up

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: |
          docker compose -f deployment/docker-compose.yml up -d
          sleep 15
          docker compose -f deployment/docker-compose.yml ps
      - name: Health check PostgreSQL
        run: |
          docker exec $(docker ps -q -f name=postgres) pg_isready -U wms
      - name: Check Kafka
        run: |
          docker exec $(docker ps -q -f name=kafka) kafka-topics.sh --bootstrap-server localhost:9092 --list
      - name: Tear down
        if: always()
        run: docker compose -f deployment/docker-compose.yml down
