openapi: "3.0.3"
info:
  title: Customer BFF API
  version: "1.0.0"
  description: BFF layer for customer management in WMS.

servers:
  - url: http://localhost:8082
    description: Local development

paths:
  /v1/customers/invite:
    post:
      operationId: InviteCustomer
      summary: Admin sends invitation to prospective customer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /v1/customers/register:
    post:
      operationId: RegisterCustomer
      summary: Customer registers via invitation token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name: { type: string }
                vat_number: { type: string }
                line1: { type: string }
                line2: { type: string }
                city: { type: string }
                postal_code: { type: string }
                country: { type: string }
                rate_card_id: { type: string }
              required: [company_name, vat_number, line1, city, country]
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /v1/customers/queue:
    get:
      operationId: GetCustomerApprovalQueue
      summary: List pending customer approvals (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Pending customers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /v1/customers/{id}/approve:
    post:
      operationId: ApproveCustomer
      summary: Approve a pending customer (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /v1/customers/{id}/suspend:
    post:
      operationId: SuspendCustomer
      summary: Suspend an active customer (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Customer suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /v1/customers/{id}:
    get:
      operationId: GetCustomer
      summary: Get customer details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

  /v1/customers/{id}/dashboard:
    get:
      operationId: GetCustomerDashboard
      summary: Get customer dashboard aggregate data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
