openapi: "3.0.3"
info:
  title: Inventory BFF API
  description: Backend-for-frontend API for inventory operations
  version: "1.0.0"
servers:
  - url: http://localhost:8084
    description: Local development

paths:
  /v1/products:
    get:
      summary: List products
      operationId: ListProducts
      tags: [Products]
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Create a new product
      operationId: CreateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name]
              properties:
                sku:
                  type: string
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                unit:
                  type: string
                weight_kg:
                  type: number
                low_stock_threshold:
                  type: number
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/products/{id}:
    get:
      summary: Get product by ID
      operationId: GetProduct
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: Update a product
      operationId: UpdateProduct
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                unit:
                  type: string
                weight_kg:
                  type: number
                low_stock_threshold:
                  type: number
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      summary: Archive a product
      operationId: ArchiveProduct
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/stock:
    get:
      summary: List stock entries
      operationId: ListStock
      tags: [Stock]
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
        - name: product_id
          in: query
          schema:
            type: string
        - name: bin_location_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Stock entries list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Add stock
      operationId: AddStock
      tags: [Stock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, bin_location_id, quantity]
              properties:
                product_id:
                  type: string
                bin_location_id:
                  type: string
                quantity:
                  type: number
                lot_number:
                  type: string
                expiry_date:
                  type: string
      responses:
        '200':
          description: Stock added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/stock/{id}:
    get:
      summary: Get stock entry by ID
      operationId: GetStock
      tags: [Stock]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stock detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      summary: Adjust stock quantity
      operationId: AdjustStock
      tags: [Stock]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta:
                  type: number
                reason:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/stock/{id}/reserve:
    post:
      summary: Reserve stock
      operationId: ReserveStock
      tags: [Stock]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: number
      responses:
        '200':
          description: Stock reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/stock/{id}/release:
    post:
      summary: Release reserved stock
      operationId: ReleaseStock
      tags: [Stock]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: number
      responses:
        '200':
          description: Stock released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /v1/bin-locations:
    get:
      summary: List bin locations
      operationId: ListBinLocations
      tags: [BinLocations]
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Bin locations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Create a bin location
      operationId: CreateBinLocation
      tags: [BinLocations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_zone, aisle, rack, shelf]
              properties:
                warehouse_zone:
                  type: string
                aisle:
                  type: string
                rack:
                  type: string
                shelf:
                  type: string
      responses:
        '200':
          description: Bin location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
