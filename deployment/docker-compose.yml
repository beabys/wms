services:
  postgres:
    image: postgres:16
    container_name: wms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms_local_dev
      POSTGRES_DB: wms_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wms-net

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    ports:
      - "6400:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wms-net

