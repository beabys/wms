syntax = "proto3";

package inventory.v1;

option go_package = "github.com/beabys/wms/proto/gen/go/inventory/v1;inventoryv1";

import "common/v1/common.proto";

message Product {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string unit = 6;
  double weight_kg = 7;
  bool is_active = 8;
  double low_stock_threshold = 9;
  string created_at = 10;
  string updated_at = 11;
}

message BinLocation {
  string id = 1;
  string warehouse_zone = 2;
  string aisle = 3;
  string rack = 4;
  string shelf = 5;
  bool is_active = 6;
}

message StockEntry {
  string id = 1;
  string product_id = 2;
  string bin_location_id = 3;
  double quantity = 4;
  double reserved_quantity = 5;
  string lot_number = 6;
  string expiry_date = 7;
  string status = 8;
  string last_updated = 9;
}

message CreateProductRequest {
  string sku = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string unit = 5;
  double weight_kg = 6;
  double low_stock_threshold = 7;
}

message CreateProductResponse {
  Product product = 1;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  common.v1.Pagination pagination = 1;
  string category = 2;
  string search = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  common.v1.Pagination pagination = 2;
}

message UpdateProductRequest {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string unit = 6;
  double weight_kg = 7;
  double low_stock_threshold = 8;
}

message UpdateProductResponse {
  Product product = 1;
}

message ArchiveProductRequest {
  string id = 1;
}

message ArchiveProductResponse {
  Product product = 1;
}

message AddStockRequest {
  string product_id = 1;
  string bin_location_id = 2;
  double quantity = 3;
  string lot_number = 4;
  string expiry_date = 5;
}

message AddStockResponse {
  StockEntry stock_entry = 1;
}

message AdjustStockRequest {
  string id = 1;
  double delta = 2;
  string reason = 3;
  string notes = 4;
}

message AdjustStockResponse {
  StockEntry stock_entry = 1;
}

message GetStockRequest {
  string id = 1;
}

message GetStockResponse {
  StockEntry stock_entry = 1;
}

message ListStockRequest {
  common.v1.Pagination pagination = 1;
  string product_id = 2;
  string bin_location_id = 3;
  string status = 4;
}

message ListStockResponse {
  repeated StockEntry stock_entries = 1;
  common.v1.Pagination pagination = 2;
}

message ReserveStockRequest {
  string id = 1;
  double quantity = 2;
}

message ReserveStockResponse {
  StockEntry stock_entry = 1;
}

message ReleaseStockRequest {
  string id = 1;
  double quantity = 2;
}

message ReleaseStockResponse {
  StockEntry stock_entry = 1;
}

message CreateBinLocationRequest {
  string warehouse_zone = 1;
  string aisle = 2;
  string rack = 3;
  string shelf = 4;
}

message CreateBinLocationResponse {
  BinLocation bin_location = 1;
}

message ListBinLocationsRequest {
  common.v1.Pagination pagination = 1;
}

message ListBinLocationsResponse {
  repeated BinLocation bin_locations = 1;
  common.v1.Pagination pagination = 2;
}

service InventoryService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc ArchiveProduct(ArchiveProductRequest) returns (ArchiveProductResponse);

  rpc AddStock(AddStockRequest) returns (AddStockResponse);
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse);
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  rpc ListStock(ListStockRequest) returns (ListStockResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);

  rpc CreateBinLocation(CreateBinLocationRequest) returns (CreateBinLocationResponse);
  rpc ListBinLocations(ListBinLocationsRequest) returns (ListBinLocationsResponse);
}
