syntax = "proto3";

package inbound.v1;

option go_package = "github.com/beabys/wms/proto/gen/go/inbound/v1;inboundv1";

import "common/v1/common.proto";

message InboundItem {
  string sku = 1;
  int32 quantity_declared = 2;
  int32 quantity_received = 3;
  string dimensions = 4;
  double weight = 5;
}

message Inspection {
  string inspector_id = 1;
  string notes = 2;
  bool passed = 3;
}

message Hold {
  string reason = 1;
  string created_at = 2;
  string released_at = 3;
}

message Inbound {
  string id = 1;
  string customer_id = 2;
  string status = 3;
  string expected_date = 4;
  string notes = 5;
  repeated InboundItem items = 6;
  Inspection inspection = 7;
  Hold hold = 8;
  string created_at = 9;
  string updated_at = 10;
}

message CreateInboundRequest {
  string customer_id = 1;
  string expected_date = 2;
  string notes = 3;
  repeated InboundItem items = 4;
}

message CreateInboundResponse {
  Inbound inbound = 1;
}

message GetInboundRequest {
  string id = 1;
}

message GetInboundResponse {
  Inbound inbound = 1;
}

message ListInboundsRequest {
  common.v1.Pagination pagination = 1;
  string customer_id = 2;
  string status = 3;
}

message ListInboundsResponse {
  repeated Inbound inbounds = 1;
  common.v1.Pagination pagination = 2;
}

message InspectInboundRequest {
  string id = 1;
  Inspection inspection = 2;
}

message InspectInboundResponse {
  Inbound inbound = 1;
}

message ApproveInboundRequest {
  string id = 1;
}

message ApproveInboundResponse {
  Inbound inbound = 1;
}

message FlagInboundRequest {
  string id = 1;
  string reason = 2;
}

message FlagInboundResponse {
  Inbound inbound = 1;
}

message HoldInboundRequest {
  string id = 1;
  string reason = 2;
}

message HoldInboundResponse {
  Inbound inbound = 1;
}

message ReleaseInboundRequest {
  string id = 1;
}

message ReleaseInboundResponse {
  Inbound inbound = 1;
}

service InboundService {
  rpc CreateInbound(CreateInboundRequest) returns (CreateInboundResponse);
  rpc GetInbound(GetInboundRequest) returns (GetInboundResponse);
  rpc ListInbounds(ListInboundsRequest) returns (ListInboundsResponse);
  rpc InspectInbound(InspectInboundRequest) returns (InspectInboundResponse);
  rpc ApproveInbound(ApproveInboundRequest) returns (ApproveInboundResponse);
  rpc FlagInbound(FlagInboundRequest) returns (FlagInboundResponse);
  rpc HoldInbound(HoldInboundRequest) returns (HoldInboundResponse);
  rpc ReleaseInbound(ReleaseInboundRequest) returns (ReleaseInboundResponse);
}
