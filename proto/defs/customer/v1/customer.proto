syntax = "proto3";

package customer.v1;

option go_package = "github.com/beabys/wms/proto/gen/go/customer/v1;customerv1";

import "common/v1/common.proto";
import "customer/v1/rate_card.proto";

message Customer {
  string id = 1;
  string company_name = 2;
  string vat_number = 3;
  common.v1.Address address = 4;
  string status = 5;
  string rate_card_id = 6;
  string credit_balance = 7;
  string created_at = 8;
}

message CreateCustomerRequest {
  string company_name = 1;
  string vat_number = 2;
  common.v1.Address address = 3;
  string rate_card_id = 4;
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetCustomerRequest {
  string id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message ListCustomersRequest {
  common.v1.Pagination pagination = 1;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  common.v1.Pagination pagination = 2;
}

message ApproveCustomerRequest {
  string customer_id = 1;
}

message ApproveCustomerResponse {
  Customer customer = 1;
}

message SuspendCustomerRequest {
  string customer_id = 1;
  string reason = 2;
}

message SuspendCustomerResponse {
  Customer customer = 1;
}

message InviteCustomerRequest {
  string email = 1;
}

message InviteCustomerResponse {
  string invitation_link = 1;
}

service CustomerService {
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc ApproveCustomer(ApproveCustomerRequest) returns (ApproveCustomerResponse);
  rpc SuspendCustomer(SuspendCustomerRequest) returns (SuspendCustomerResponse);
  rpc InviteCustomer(InviteCustomerRequest) returns (InviteCustomerResponse);
}
