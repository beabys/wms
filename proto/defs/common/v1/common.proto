syntax = "proto3";
package common.v1;

option go_package = "github.com/beabys/wms/proto/gen/go/common/v1;commonv1";

// Money represents an amount of money with its currency.
message Money {
  string currency = 1;  // ISO 4217 currency code (e.g., "USD", "EUR")
  int64 units = 2;       // whole units of the currency
  int32 nanos = 3;       // decimal fraction (from -999,999,999 to 999,999,999)
}

// Address represents a postal address.
message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string postal_code = 4;
  string country = 5;  // ISO 3166-1 alpha-2 country code
}

// Timestamp represents a point in time (seconds and nanos since Unix epoch).
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Pagination contains pagination metadata.
message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
  int32 total_pages = 4;
}
